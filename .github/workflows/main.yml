    - name: Fix JVM target
        working-directory: project
        run: |
          sed -i "/android {/a\\    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }" app/build.gradle
          sed -i "/android {/a\\    kotlinOptions { jvmTarget = '17' }" app/build.gradle
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q InstagramReelFinder_Android_Prototype.zip -d project
      
      - name: Enable AndroidX
        run: echo "android.useAndroidX=true" > project/gradle.properties
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReelFinder-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
